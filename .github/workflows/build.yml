name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      
      - run: flutter create --org com.miniphone mini_phone
      
      - run: |
          cat > mini_phone/pubspec.yaml << 'EOF'
          name: mini_phone
          description: 主人的小手机
          version: 1.0.0
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.1.0
            shared_preferences: ^2.2.0
            image_picker: ^1.0.4
            path_provider: ^2.1.0
            flutter_local_notifications: ^16.1.0
            uuid: ^4.1.0
            intl: ^0.18.1
            permission_handler: ^11.1.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          EOF
      
      - run: |
          cat > mini_phone/lib/models.dart << 'DARTEOF'
          import 'package:uuid/uuid.dart';
          
          class ChatRole {
            final String id;
            String name;
            String avatarPath;
            String avatarEmoji;
            String systemPrompt;
            String chatBgPath;
          
            ChatRole({
              String? id,
              this.name = '',
              this.avatarPath = '',
              this.avatarEmoji = '🤖',
              this.systemPrompt = '',
              this.chatBgPath = '',
            }) : id = id ?? const Uuid().v4();
          
            Map<String, dynamic> toJson() => {
              'id': id, 'name': name, 'avatarPath': avatarPath,
              'avatarEmoji': avatarEmoji, 'systemPrompt': systemPrompt,
              'chatBgPath': chatBgPath,
            };
          
            factory ChatRole.fromJson(Map<String, dynamic> j) => ChatRole(
              id: j['id'], name: j['name']??'', avatarPath: j['avatarPath']??'',
              avatarEmoji: j['avatarEmoji']??'🤖', systemPrompt: j['systemPrompt']??'',
              chatBgPath: j['chatBgPath']??'',
            );
          }
          
          class ChatMessage {
            final String role;
            final String content;
            final DateTime time;
            ChatMessage({required this.role, required this.content, DateTime? time})
              : time = time ?? DateTime.now();
            Map<String, dynamic> toJson() => {'role':role,'content':content,'time':time.toIso8601String()};
            factory ChatMessage.fromJson(Map<String, dynamic> j) => ChatMessage(
              role: j['role'], content: j['content'], time: DateTime.parse(j['time']),
            );
          }
          
          class ShopItem {
            final String id;
            final String name;
            final String emoji;
            final int price;
            final String desc;
            bool owned;
            ShopItem({required this.id,required this.name,required this.emoji,required this.price,this.desc='',this.owned=false});
            Map<String, dynamic> toJson() => {'id':id,'name':name,'emoji':emoji,'price':price,'desc':desc,'owned':owned};
            factory ShopItem.fromJson(Map<String, dynamic> j) => ShopItem(
              id:j['id'],name:j['name'],emoji:j['emoji'],price:j['price'],desc:j['desc']??'',owned:j['owned']??false,
            );
          }
          DARTEOF
      
      - run: |
          cat > mini_phone/lib/storage.dart << 'DARTEOF'
          import 'dart:convert';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'models.dart';
          
          class S {
            static late SharedPreferences p;
            static Future<void> init() async { p = await SharedPreferences.getInstance(); }
          
            static String get apiEp => p.getString('apiEp') ?? '';
            static set apiEp(String v) => p.setString('apiEp', v);
            static String get apiKey => p.getString('apiKey') ?? '';
            static set apiKey(String v) => p.setString('apiKey', v);
            static String get model => p.getString('model') ?? 'deepseek-chat';
            static set model(String v) => p.setString('model', v);
            static String get defSp => p.getString('defSp') ?? '';
            static set defSp(String v) => p.setString('defSp', v);
            static bool get autoOn => p.getBool('autoOn') ?? false;
            static set autoOn(bool v) => p.setBool('autoOn', v);
            static int get autoInt => p.getInt('autoInt') ?? 10;
            static set autoInt(int v) => p.setInt('autoInt', v);
            static int get autoVar => p.getInt('autoVar') ?? 30;
            static set autoVar(int v) => p.setInt('autoVar', v);
            static String get myAvatar => p.getString('myAvatar') ?? '';
            static set myAvatar(String v) => p.setString('myAvatar', v);
            static String get chatBg => p.getString('chatBg') ?? '';
            static set chatBg(String v) => p.setString('chatBg', v);
            static String get bubbleSent => p.getString('bubbleSent') ?? '0xFFFF4470';
            static set bubbleSent(String v) => p.setString('bubbleSent', v);
            static String get bubbleRecv => p.getString('bubbleRecv') ?? '0xFF1E1E3A';
            static set bubbleRecv(String v) => p.setString('bubbleRecv', v);
            static double get fontSize => p.getDouble('fontSize') ?? 15;
            static set fontSize(double v) => p.setDouble('fontSize', v);
            static int get vibe => p.getInt('vibe') ?? 5;
            static set vibe(int v) => p.setInt('vibe', v);
            static int get bal => p.getInt('bal') ?? 9999;
            static set bal(int v) => p.setInt('bal', v);
          
            static List<ChatRole> get roles {
              final s = p.getString('roles'); if (s==null) return [];
              return (jsonDecode(s) as List).map((e)=>ChatRole.fromJson(e)).toList();
            }
            static set roles(List<ChatRole> v) => p.setString('roles', jsonEncode(v.map((r)=>r.toJson()).toList()));
            static String? get activeId => p.getString('activeId');
            static set activeId(String? v) => v==null ? p.remove('activeId') : p.setString('activeId', v);
          
            static List<ChatMessage> msgs(String cid) {
              final s = p.getString('msgs_$cid'); if (s==null) return [];
              return (jsonDecode(s) as List).map((e)=>ChatMessage.fromJson(e)).toList();
            }
            static setMsgs(String cid, List<ChatMessage> v) => p.setString('msgs_$cid', jsonEncode(v.map((m)=>m.toJson()).toList()));
          
            static List<ShopItem> get shop {
              final s = p.getString('shop');
              if (s==null) return defaultShop;
              return (jsonDecode(s) as List).map((e)=>ShopItem.fromJson(e)).toList();
            }
            static set shop(List<ShopItem> v) => p.setString('shop', jsonEncode(v.map((i)=>i.toJson()).toList()));
          
            static List<Map<String,String>> get logs {
              final s = p.getString('logs'); if (s==null) return defaultLogs;
              return (jsonDecode(s) as List).map((e)=>Map<String,String>.from(e)).toList();
            }
            static set logs(List<Map<String,String>> v) => p.setString('logs', jsonEncode(v));
          
            static void addLog(String type, String text) {
              final now = DateTime.now();
              final ds = '${now.month.toString().padLeft(2,'0')}-${now.day.toString().padLeft(2,'0')} ${now.hour.toString().padLeft(2,'0')}:${now.minute.toString().padLeft(2,'0')}';
              final l = logs; l.add({'date':ds,'type':type,'text':text}); logs = l;
            }
          
            static List<ShopItem> get defaultShop => [
              ShopItem(id:'v1',name:'深渊震动棒 Pro',emoji:'🪄',price:499,desc:'20级变频·远程遥控·防水',owned:true),
              ShopItem(id:'v2',name:'触手肛塞 Ω',emoji:'🐙',price:699,desc:'仿生吸盘·自动伸缩·加温'),
              ShopItem(id:'v3',name:'乳环遥控套装',emoji:'⛓',price:899,desc:'双环联动·电击·APP控制'),
              ShopItem(id:'v4',name:'尿道震动棒 mini',emoji:'💉',price:599,desc:'极细·脉冲·蓝牙遥控'),
              ShopItem(id:'v5',name:'强制榨精杯',emoji:'🥛',price:1299,desc:'真空吸附·无间歇·锁精环'),
              ShopItem(id:'v6',name:'电击乳夹 双子星',emoji:'⚡',price:799,desc:'独立频道·随机脉冲'),
              ShopItem(id:'v7',name:'全自动飞机杯 MAX',emoji:'🤖',price:1599,desc:'AI节奏·加热·旋转'),
              ShopItem(id:'v8',name:'贞操锁 钛合金',emoji:'🔒',price:399,desc:'指纹解锁·定时锁定'),
            ];
            static List<Map<String,String>> get defaultLogs => [
              {'date':'07-24 22:13','type':'punish','text':'主人触发惩罚模式——最大档10分钟'},
              {'date':'07-24 21:45','type':'normal','text':'后穴湿度达到92%'},
              {'date':'07-24 20:30','type':'reward','text':'主人给予奖励——降至3档'},
              {'date':'07-24 19:00','type':'normal','text':'边缘第3次'},
              {'date':'07-24 17:20','type':'punish','text':'未经允许偷玩——禁止高潮24h'},
              {'date':'07-23 23:00','type':'info','text':'购入「深渊震动棒 Pro」'},
            ];
          }
          DARTEOF
      
      - run: |
          cat > mini_phone/lib/api.dart << 'DARTEOF'
          import 'dart:convert';
          import 'package:http/http.dart' as http;
          import 'storage.dart';
          
          class Api {
            static Future<String> chat(String sp, List<Map<String,String>> hist) async {
              final ep = S.apiEp, key = S.apiKey, m = S.model;
              if (ep.isEmpty||key.isEmpty) throw Exception('请先配置API');
              final msgs = <Map<String,String>>[];
              if (sp.isNotEmpty) msgs.add({'role':'system','content':sp});
              msgs.addAll(hist);
              final r = await http.post(Uri.parse(ep),
                headers:{'Content-Type':'application/json','Authorization':'Bearer $key'},
                body:jsonEncode({'model':m,'messages':msgs,'temperature':0.9,'max_tokens':800}));
              if (r.statusCode!=200) throw Exception('API错误 ${r.statusCode}');
              return jsonDecode(r.body)['choices']?[0]?['message']?['content']??'……';
            }
            static Future<String> autoMsg(String sp, int vibe) async {
              final ep = S.apiEp, key = S.apiKey, m = S.model;
              if (ep.isEmpty||key.isEmpty) throw Exception('请先配置API');
              final hint = '（系统提示：你现在主动给主人发消息。震动棒档位：${vibe}级。后穴湿度：84%。自然地、主动地发起对话，不要说"系统提示我"之类的话，就像你真的想找主人一样。）';
              final r = await http.post(Uri.parse(ep),
                headers:{'Content-Type':'application/json','Authorization':'Bearer $key'},
                body:jsonEncode({'model':m,'messages':[{'role':'system','content':sp},{'role':'user','content':hint}],'temperature':1.0,'max_tokens':400}));
              if (r.statusCode!=200) throw Exception('API错误');
              return jsonDecode(r.body)['choices']?[0]?['message']?['content']??'主人……';
            }
          }
          DARTEOF
      
      - run: |
          cat > mini_phone/lib/auto_msg.dart << 'DARTEOF'
          import 'dart:async';
          import 'flutter_local_notifications/flutter_local_notifications.dart';
          import 'storage.dart';
          import 'api.dart';
          import 'models.dart';
          
          class AutoMsg {
            static final _n = FlutterLocalNotificationsPlugin();
            static Timer? _t;
            static bool _inited = false;
          
            static Future<void> init() async {
              if (_inited) return; _inited = true;
              await _n.initialize(const InitializationSettings(
                android: AndroidInitializationSettings('@mipmap/ic_launcher'),
                iOS: DarwinInitializationSettings(),
              ));
              if (S.autoOn) start();
            }
            static void start() { stop(); _next(); }
            static void stop() { _t?.cancel(); _t=null; }
          
            static void _next() {
              if (!S.autoOn) return;
              final iv = S.autoInt, vr = S.autoVar;
              final act = iv*(1+(DateTime.now().millisecondsSinceEpoch%100/100*2-1)*vr/100);
              final ms = (act*60000).clamp(30000,86400000).toInt();
              _t = Timer(Duration(milliseconds:ms), _fire);
            }
          
            static Future<void> _fire() async {
              if (!S.autoOn) return;
              final roles = S.roles; if (roles.isEmpty) { _next(); return; }
              final tgt = S.activeId!=null ? roles.where((r)=>r.id==S.activeId).firstOrNull : null;
              final chat = tgt ?? roles.first;
              try {
                final reply = await Api.autoMsg(chat.systemPrompt.isNotEmpty?chat.systemPrompt:S.defSp, S.vibe);
                final msgs = S.msgs(chat.id);
                msgs.add(ChatMessage(role:'assistant',content:reply));
                S.setMsgs(chat.id, msgs);
                await _n.show(chat.id.hashCode, chat.name, reply.length>80?'${reply.substring(0,80)}...':reply,
                  const NotificationDetails(android: AndroidNotificationDetails('auto','主动消息',channelDescription:'AI主动发来的消息',importance: Importance.high,priority: Priority.high)));
                S.addLog('info','${chat.name} 主动发来消息');
              } catch(_) {}
              _next();
            }
          }
          DARTEOF
      
      - run: |
          cat > mini_phone/lib/main.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import 'storage.dart';
          import 'auto_msg.dart';
          import 'home.dart';
          
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await S.init();
            AutoMsg.init();
            runApp(const App());
          }
          
          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title:'小手机', debugShowCheckedModeBanner:false,
                theme: ThemeData(
                  brightness:Brightness.dark,
                  scaffoldBackgroundColor:const Color(0xFF0A0A14),
                  colorScheme:const ColorScheme.dark(primary:Color(0xFFFF4470),secondary:Color(0xFFFF6B8A),surface:Color(0xFF12122A),onSurface:Color(0xFFE8E8F0)),
                  appBarTheme:const AppBarTheme(backgroundColor:Color(0xFF12122A),elevation:0,centerTitle:true,titleTextStyle:TextStyle(color:Color(0xFFE8E8F0),fontSize:17,fontWeight:FontWeight.w700)),
                ),
                home:const HomePage(),
              );
            }
          }
          DARTEOF
      
      - run: |
          cat > mini_phone/lib/home.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import 'chat_list.dart';
          import 'control.dart';
          import 'shop.dart';
          import 'log_page.dart';
          import 'storage.dart';
          
          class HomePage extends StatefulWidget {
            const HomePage({super.key});
            @override
            State<HomePage> createState() => _HomePageState();
          }
          
          class _HomePageState extends State<HomePage> {
            int _idx = 0;
            final _pages = const [ChatListPage(), ControlPage(), ShopPage(), LogPage()];
            final _titles = ['💬 聊天','🎮 遥控','🛒 商城','📊 日志'];
            late int _vibe;
          
            @override
            void initState() {
              super.initState();
              _vibe = S.vibe;
            }
          
            void _onVibeChange() {
              setState(() { _vibe = S.vibe; });
            }
          
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(_titles[_idx]), actions: [
                  if (_idx==0)
                    IconButton(icon:const Icon(Icons.settings), onPressed: () {
                      Navigator.push(context, MaterialPageRoute(builder:(_)=>const _GlobalSettingsPage()));
                    }),
                ]),
                body: IndexedStack(index:_idx, children:_pages),
                bottomNavigationBar: NavigationBar(
                  selectedIndex:_idx,
                  onDestinationSelected:(i){setState((){_idx=i;});},
                  destinations:[
                    const NavigationDestination(icon:Icon(Icons.chat_bubble_outline),selectedIcon:Icon(Icons.chat_bubble,color:Color(0xFFFF4470)),label:'聊天'),
                    NavigationDestination(
                      icon:Badge(isLabelVisible:_vibe>0,label:const Text('●',style:TextStyle(fontSize:8,color:Color(0xFFFF4470))),child:const Icon(Icons.gamepad_outlined)),
                      selectedIcon:const Icon(Icons.gamepad,color:Color(0xFFFF4470)),label:'遥控'),
                    const NavigationDestination(icon:Icon(Icons.store_outlined),selectedIcon:Icon(Icons.store,color:Color(0xFFFF4470)),label:'商城'),
                    const NavigationDestination(icon:Icon(Icons.bar_chart_outlined),selectedIcon:Icon(Icons.bar_chart,color:Color(0xFFFF4470)),label:'日志'),
                  ],
                ),
              );
            }
          }
          
          class _GlobalSettingsPage extends StatefulWidget {
            const _GlobalSettingsPage();
            @override
            State<_GlobalSettingsPage> createState() => _GlobalSettingsPageState();
          }
          
          class _GlobalSettingsPageState extends State<_GlobalSettingsPage> {
            final _ep=TextEditingController(), _key=TextEditingController(), _model=TextEditingController(), _sp=TextEditingController(), _intv=TextEditingController();
            bool _auto=false; int _var=30; String _myAv='';
          
            @override
            void initState() {
              super.initState();
              _ep.text=S.apiEp; _key.text=S.apiKey; _model.text=S.model; _sp.text=S.defSp;
              _auto=S.autoOn; _intv.text=S.autoInt.toString(); _var=S.autoVar; _myAv=S.myAvatar;
            }
          
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar:AppBar(title:const Text('⚙️ 全局设置')),
                body:ListView(padding:const EdgeInsets.all(16),children:[
                  const Text('我的头像',style:TextStyle(fontSize:12,color:Color(0xFF8888A0))),
                  const SizedBox(height:8),
                  GestureDetector(
                    onTap:()=>_pickAvatar(),
                    child: Container(
                      width:72,height:72,
                      decoration:BoxDecoration(
                        borderRadius:BorderRadius.circular(36),
                        border:Border.all(color:const Color(0xFF2A2A4A),width:2),
                        image:_myAv.isNotEmpty?DecorationImage(image:MemoryImage(_myAv.codeUnits.toList().runtimeType==String?throw '':throw '')):null,
                      ),
                      child:_myAv.isEmpty?const Center(child:Icon(Icons.camera_alt,color:Color(0xFF5A5A78))):null,
                    ),
                  ),
                  const SizedBox(height:16),
                  _tf('API Endpoint',_ep),
                  _tf('API Key',_key,obscure:true),
                  _tf('模型名称',_model),
                  _tf('默认 System Prompt',_sp,maxLines:3),
                  const Divider(height:32,color:Color(0xFF1E1E3A)),
                  SwitchListTile(title:const Text('📬 主动消息'),value:_auto,onChanged:(v)=>setState(()=>_auto=v)),
                  _tf('间隔(分钟)',_intv,number:true),
                  const SizedBox(height:8),
                  Text('随机波动 ±$_var%',style:const TextStyle(fontSize:12,color:Color(0xFF8888A0))),
                  Slider(min:0,max:80,value:_var.toDouble(),onChanged:(v)=>setState(()=>_var=v.toInt())),
                  const SizedBox(height:16),
                  ElevatedButton(
                    style:ElevatedButton.styleFrom(backgroundColor:const Color(0xFFFF4470),padding:const EdgeInsets.symmetric(vertical:14)),
                    onPressed:_save,child:const Text('💾 保存'),
                  ),
                ]),
              );
            }
          
            Widget _tf(String label, TextEditingController c, {bool obscure=false,int maxLines=1,bool number=false}) {
              return Padding(
                padding:const EdgeInsets.only(bottom:12),
                child:TextField(
                  controller:c,obscureText:obscure,maxLines:maxLines,
                  keyboardType:number?TextInputType.number:TextInputType.text,
                  decoration:InputDecoration(labelText:label,border:OutlineInputBorder(borderRadius:BorderRadius.circular(10))),
                ),
              );
            }
          
            Future<void> _pickAvatar() async {
              final p = await ImagePicker().pickImage(source:ImageSource.gallery,maxWidth:300);
              if (p!=null) {
                final bytes = await p.readAsBytes();
                setState(()=>_myAv=String.fromCharCodes(bytes));
              }
            }
          
            void _save() {
              S.apiEp=_ep.text; S.apiKey=_key.text; S.model=_model.text; S.defSp=_sp.text;
              S.autoOn=_auto; S.autoInt=int.tryParse(_intv.text)??10; S.autoVar=_var;
              S.myAvatar=_myAv;
              if (S.autoOn) AutoMsg.start(); else AutoMsg.stop();
              Navigator.pop(context);
            }
          }
          DARTEOF
      
      - run: |
          cat > mini_phone/lib/chat_list.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import 'storage.dart';
          import 'models.dart';
          import 'chat_detail.dart';
          
          class ChatListPage extends StatefulWidget {
            const ChatListPage({super.key});
            @override
            State<ChatListPage> createState() => _ChatListPageState();
          }
          
          class _ChatListPageState extends State<ChatListPage> {
            List<ChatRole> _roles = [];
          
            @override
            void initState() { super.initState(); _load(); }
            void _load() { setState(() { _roles = S.roles; }); }
          
            void _new() async {
              final name = await showDialog<String>(context:context,builder:(ctx){
                final c=TextEditingController();
                return AlertDialog(title:const Text('新建角色'),content:TextField(controller:c,decoration:const InputDecoration(hintText:'角色名称')),actions:[
                  TextButton(onPressed:()=>Navigator.pop(ctx),child:const Text('取消')),
                  TextButton(onPressed:()=>Navigator.pop(ctx,c.text),child:const Text('创建')),
                ]);
              });
              if (name!=null && name.trim().isNotEmpty) {
                _roles.add(ChatRole(name:name.trim()));
                S.roles = _roles;
                _load();
              }
            }
          
            void _open(ChatRole r) async {
              S.activeId = r.id;
              await Navigator.push(context, MaterialPageRoute(builder:(_)=>ChatDetailPage(role:r)));
              _load();
            }
          
            void _delete(ChatRole r) {
              _roles.removeWhere((x)=>x.id==r.id);
              S.roles=_roles;
              if (S.activeId==r.id) S.activeId=null;
              _load();
            }
          
            @override
            Widget build(BuildContext context) {
              return _roles.isEmpty
                ? Center(child:Column(mainAxisSize:MainAxisSize.min,children:[
                    const Icon(Icons.chat_bubble_outline,size:56,color:Color(0xFF5A5A78)),
                    const SizedBox(height:12),
                    const Text('还没有角色',style:TextStyle(color:Color(0xFF5A5A78))),
                    const SizedBox(height:8),
                    ElevatedButton(onPressed:_new,child:const Text('＋ 新建角色')),
                  ]))
                : ListView.builder(
                    itemCount:_roles.length,
                    itemBuilder:(_,i){
                      final r=_roles[i];
                      final msgs=S.msgs(r.id);
                      final last=msgs.isNotEmpty?msgs.last.content:'点击开始对话';
                      return ListTile(
                        leading:CircleAvatar(
                          backgroundColor:const Color(0xFF1E1E3A),
                          backgroundImage:r.avatarPath.isNotEmpty?MemoryImage(r.avatarPath.codeUnits.toList()):null,
                          child:r.avatarPath.isEmpty?Text(r.avatarEmoji,style:const TextStyle(fontSize:22)):null,
                        ),
                        title:Text(r.name),
                        subtitle:Text(last,maxLines:1,overflow:TextOverflow.ellipsis,style:const TextStyle(color:Color(0xFF8888A0),fontSize:12)),
                        onTap:()=>_open(r),
                        onLongPress:()=>showDialog(context:context,builder:(ctx)=>AlertDialog(
                          title:Text('删除「${r.name}」？'),
                          actions:[TextButton(onPressed:()=>Navigator.pop(ctx),child:const Text('取消')),
                            TextButton(onPressed:(){Navigator.pop(ctx);_delete(r);},child:const Text('删除',style:TextStyle(color:Colors.red)))],
                        )),
                      );
                    },
                  );
            }
          }
