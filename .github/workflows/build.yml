          import 'package:flutter/material.dart';
          import 'storage.dart';
          
          class LogPage extends StatefulWidget {
            const LogPage({super.key});
            @override
            State<LogPage> createState() => _LogPageState();
          }
          
          class _LogPageState extends State<LogPage> {
            List<Map<String,String>> _logs=[];
            int _punish=0,_reward=0,_edge=0;
          
            @override
            void initState() { super.initState(); _load(); }
            void _load() {
              _logs=S.logs;
              final w=DateTime.now().subtract(const Duration(days:7));
              final wl=_logs.where((l){
                final p=l['date']!.split(' ')[0].split('-');
                return DateTime(2026,int.parse(p[0]),int.parse(p[1])).isAfter(w);
              }).toList();
              _punish=wl.where((l)=>l['type']=='punish').length;
              _reward=wl.where((l)=>l['type']=='reward').length;
              _edge=wl.where((l)=>l['type']=='normal'&&l['text']!.contains('边缘')).length;
              setState((){});
            }
          
            Color _dotColor(String t) {
              switch(t){case'punish':return const Color(0xFFFF4470);case'reward':return const Color(0xFFF0C060);case'info':return const Color(0xFF4ADE80);default:return const Color(0xFFFF6B8A);}
            }
          
            @override
            Widget build(BuildContext context) {
              return ListView(children:[
                Card(color:const Color(0xFF12122A),margin:const EdgeInsets.all(16),child:Padding(padding:const EdgeInsets.all(16),child:Column(children:[
                  const Text('📊',style:TextStyle(fontSize:42)),
                  const Text('本周统计',style:TextStyle(fontWeight:FontWeight.w700)),
                  const SizedBox(height:12),
                  Row(mainAxisAlignment:MainAxisAlignment.spaceEvenly,children:[
                    _stat('$_punish','惩罚',const Color(0xFFFF4470)),
                    _stat('$_reward','奖励',const Color(0xFFF0C060)),
                    _stat('$_edge','边缘',const Color(0xFFFF6B8A)),
                  ]),
                ]))),
                ..._logs.reversed.map((l)=>ListTile(
                  leading:CircleAvatar(radius:4,backgroundColor:_dotColor(l['type']!)),
                  title:Text(l['text']!,style:const TextStyle(fontSize:13)),
                  trailing:Text(l['date']!,style:const TextStyle(fontSize:11,color:Color(0xFF5A5A78))),
                )),
              ]);
            }
          
            Widget _stat(String v,String l,Color c) {
              return Column(children:[
                Text(v,style:TextStyle(fontSize:22,fontWeight:FontWeight.w800,color:c)),
                Text(l,style:const TextStyle(fontSize:10,color:Color(0xFF5A5A78))),
              ]);
            }
          }
