          }
          
          class _ShopPageState extends State<ShopPage> {
            List<ShopItem> _items=[];
            int _bal=0;
          
            @override
            void initState() { super.initState(); _load(); }
            void _load() { setState((){_items=S.shop;_bal=S.bal;}); }
          
            void _buy(ShopItem item) {
              if (item.owned) return;
              if (_bal<item.price) { ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('金币不足！'))); return; }
              setState((){_bal-=item.price;item.owned=true;});
              S.bal=_bal; S.shop=_items;
              S.addLog('info','购入「${item.name}」-${item.price}金币');
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('🎉 购入「${item.name}」！')));
            }
          
            @override
            Widget build(BuildContext context) {
              return Column(children:[
                Padding(padding:const EdgeInsets.all(16),child:Row(mainAxisAlignment:MainAxisAlignment.spaceBetween,children:[
                  const Text('🛒 情趣商城',style:TextStyle(fontWeight:FontWeight.w700,fontSize:16)),
                  Text('💰 $_bal',style:const TextStyle(color:Color(0xFFF0C060),fontWeight:FontWeight.w600)),
