                      child:Container(height:60,decoration:BoxDecoration(borderRadius:BorderRadius.circular(8),border:Border.all(color:const Color(0xFF2A2A4A)),
                        image:_role.chatBgPath.isNotEmpty?DecorationImage(image:MemoryImage(_role.chatBgPath.codeUnits.toList()),fit:BoxFit.cover):null),
                        child:_role.chatBgPath.isEmpty?const Center(child:Text('📷 点击上传聊天背景',style:TextStyle(color:Color(0xFF5A5A78),fontSize:12))):null),
                    ),
                    const SizedBox(height:12),
                    TextField(controller:spCtrl,decoration:const InputDecoration(labelText:'System Prompt / 人设',border:OutlineInputBorder()),maxLines:3),
                  ])),
                  actions:[
